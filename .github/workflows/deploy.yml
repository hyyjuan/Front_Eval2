name: CI/CD Frontend — Innovatech

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push imagen frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:${{ github.sha }}

      - name: Deploy en ec2-front
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo '${{ secrets.DOCKERHUB_TOKEN }}' | \
              docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin
            docker stop frontend || true
            docker rm   frontend || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest
            docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 5000:5000 \
              -e PORT=5000 \
              -e DEBUG=False \
              -e SECRET_KEY=clave_secreta_produccion \
              -e BACKEND_URL=http://10.0.2.196:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest
            docker image prune -f